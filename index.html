<!-- Part 1 of 4: beginning of index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#251033">
    <meta name="description" content="St. Monica LK3C Bible Study — faith, reflection, conversation and fellowship at Lower Kabete Campus.">
    <title>St. Monica LK3C | Bible Study</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- PREMIUM MEMBERSHIP REDESIGN -->
    <style>
        :root {
            --auth-ink: #271333;
            --auth-plum: #49205f;
            --auth-purple: #6d4387;
            --auth-lilac: #eee4f4;
            --auth-gold: #d6b36e;
            --auth-muted: #82758a;
            --auth-paper: #fff;
            --auth-bg: #f7f3f9;
        }

        [hidden] {
            display: none !important;
        }

        #membership {
            position: relative;
            isolation: isolate;
            min-height: 100vh;
            padding: 42px 22px 75px;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 4% 5%, rgba(214,179,110,.16), transparent 32%),
                radial-gradient(ellipse at 95% 95%, rgba(109,67,135,.13), transparent 36%),
                var(--auth-bg);
        }

        #membership::before,
        #membership::after {
            content: "";
            position: absolute;
            z-index: -1;
            width: 270px;
            height: 270px;
            border: 1px solid rgba(109,67,135,.09);
            border-radius: 50%;
            pointer-events: none;
        }

        #membership::before {
            top: 70px;
            right: -140px;
            box-shadow: 0 0 0 28px rgba(109,67,135,.025),
                        0 0 0 58px rgba(109,67,135,.02);
        }

        #membership::after {
            bottom: 20px;
            left: -180px;
            box-shadow: 0 0 0 28px rgba(214,179,110,.04),
                        0 0 0 58px rgba(214,179,110,.025);
        }

        #membership > .section-container {
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
        }

        .auth-showcase {
            display: grid;
            grid-template-columns: minmax(0, .93fr) minmax(0, 1.07fr);
            min-height: 620px;
            overflow: hidden;
            background: var(--auth-paper);
            border: 1px solid rgba(73,32,95,.08);
            border-radius: 26px;
            box-shadow: 0 32px 85px rgba(39,19,51,.13);
        }

        .auth-brand-panel {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100%;
            padding: 42px 38px 34px;
            overflow: hidden;
            color: #fff;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(214,179,110,.17), transparent 37%),
                radial-gradient(ellipse at 95% 80%, rgba(157,111,181,.20), transparent 42%),
                linear-gradient(150deg, #321641 0%, #49205f 52%, #251033 100%);
        }

        .auth-brand-panel::before {
            content: "";
            position: absolute;
            width: 330px;
            height: 330px;
            top: 26%;
            right: -185px;
            border: 1px solid rgba(255,255,255,.11);
            border-radius: 50%;
            box-shadow:
                0 0 0 24px rgba(255,255,255,.025),
                0 0 0 52px rgba(255,255,255,.02),
                0 0 0 82px rgba(255,255,255,.015);
            pointer-events: none;
        }

        .auth-brand-panel::after {
            content: "✦";
            position: absolute;
            right: 42px;
            top: 48%;
            color: rgba(214,179,110,.38);
            font-size: 30px;
            pointer-events: none;
        }

        .auth-brand-top,
        .auth-brand-copy,
        .auth-brand-bottom {
            position: relative;
            z-index: 1;
        }

        .auth-brand-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .auth-brand-emblem {
            display: grid;
            place-items: center;
            flex: 0 0 44px;
            width: 44px;
            height: 44px;
            color: var(--auth-gold);
            border: 1px solid rgba(214,179,110,.65);
            border-radius: 50%;
            font-size: 25px;
        }

        .auth-brand-name {
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.6px;
            text-transform: uppercase;
        }

        .auth-brand-subname {
            margin-top: 4px;
            color: rgba(255,255,255,.62);
            font-size: 10px;
            letter-spacing: .8px;
        }

        .auth-brand-copy {
            padding: 55px 0;
        }

        .auth-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            color: var(--auth-gold);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2.3px;
            text-transform: uppercase;
        }

        .auth-eyebrow::before {
            content: "";
            width: 24px;
            height: 1px;
            background: var(--auth-gold);
        }

        .auth-brand-copy h1 {
            max-width: 390px;
            margin: 0;
            color: #fff;
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(38px, 4vw, 55px);
            font-weight: 500;
            line-height: 1.12;
            letter-spacing: -1.5px;
        }

        .auth-brand-copy h1 em {
            color: var(--auth-gold);
            font-weight: 500;
        }

        .auth-brand-description {
            max-width: 335px;
            margin: 22px 0 0;
            color: rgba(255,255,255,.73);
            font-size: 13px;
            line-height: 2;
        }

        .auth-brand-verse {
            max-width: 320px;
            margin-top: 32px;
            padding: 17px 19px;
            border-left: 2px solid var(--auth-gold);
            background: rgba(255,255,255,.055);
        }

        .auth-brand-verse p {
            margin: 0;
            color: rgba(255,255,255,.88);
            font-family: "Playfair Display", Georgia, serif;
            font-size: 16px;
            font-style: italic;
            line-height: 1.65;
        }

        .auth-brand-verse span {
            display: block;
            margin-top: 9px;
            color: var(--auth-gold);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .auth-brand-bottom {
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,.13);
            color: rgba(255,255,255,.52);
            font-size: 10px;
            letter-spacing: .7px;
            line-height: 1.8;
        }

        .auth-form-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 43px clamp(25px, 4vw, 52px);
            background: #fff;
        }

        .auth-form-heading {
            margin-bottom: 27px;
        }

        .auth-form-kicker {
            display: block;
            margin-bottom: 10px;
            color: var(--auth-purple);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .auth-form-heading h2,
        .auth-form-heading h3 {
            margin: 0;
            color: var(--auth-ink);
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(27px, 3vw, 35px);
            font-weight: 600;
            line-height: 1.25;
            letter-spacing: -.6px;
        }

        .auth-form-heading p {
            margin: 11px 0 0;
            color: var(--auth-muted);
            font-size: 12px;
            line-height: 1.8;
        }

        .auth-choice-actions {
            display: grid;
            gap: 12px;
            margin-top: 30px;
        }

        .auth-choice-actions button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            width: 100%;
            min-height: 58px;
            padding: 0 19px;
            border: 1px solid #e8deed;
            border-radius: 12px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .auth-choice-actions button span {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .auth-button-icon {
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            border-radius: 9px;
            font-size: 16px;
        }

        .auth-choice-actions .auth-register-action {
            color: #fff;
            border-color: transparent;
            background: linear-gradient(130deg, #49205f, #70458a);
            box-shadow: 0 9px 20px rgba(73,32,95,.17);
        }

        .auth-register-action .auth-button-icon {
            color: var(--auth-gold);
            background: rgba(255,255,255,.12);
        }

        .auth-choice-actions .auth-login-action {
            color: var(--auth-ink);
            background: #fff;
        }

        .auth-login-action .auth-button-icon {
            color: var(--auth-purple);
            background: var(--auth-lilac);
        }

        .auth-choice-actions button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(39,19,51,.11);
        }

        .auth-choice-arrow {
            font-size: 18px;
            opacity: .7;
        }

        .auth-form-divider {
            display: flex;
            align-items: center;
            gap: 13px;
            margin: 25px 0 18px;
            color: #a094a8;
            font-size: 10px;
        }

        .auth-form-divider::before,
        .auth-form-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #eee7f1;
        }

        .auth-choice-footnote {
            margin: 0;
            color: #93879a;
            font-size: 10px;
            line-height: 1.8;
            text-align: center;
        }

        #membership-forms {
            width: 100%;
        }

        #membership-form,
        #membership-login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            padding: 0;
            margin: 0;
            background: transparent;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .auth-back-button {
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 0;
            margin: 0 0 8px;
            color: var(--auth-purple);
            background: transparent;
            border: 0;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-back-button:hover {
            color: var(--auth-ink);
        }

        .auth-form-fields {
            display: grid;
            gap: 14px;
        }

        .auth-field label {
            display: block;
            margin-bottom: 7px;
            color: #403347;
            font-size: 11px;
            font-weight: 700;
        }

        .auth-field input,
        .auth-field select {
            box-sizing: border-box;
            width: 100%;
            min-height: 47px;
            padding: 12px 14px;
            color: var(--auth-ink);
            background: #fcfaff;
            border: 1px solid #e7dfea;
            border-radius: 10px;
            outline: none;
            font-family: inherit;
            font-size: 12px;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .auth-field input::placeholder {
            color: #a69aab;
        }

        .auth-field input:hover,
        .auth-field select:hover {
            border-color: #c9b4d6;
        }

        .auth-field input:focus,
        .auth-field select:focus {
            background: #fff;
            border-color: #81549a;
            box-shadow: 0 0 0 4px rgba(109,67,135,.10);
        }

        .auth-submit-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            min-height: 51px;
            margin-top: 4px;
            padding: 13px 18px;
            color: #fff;
            background: linear-gradient(130deg, #49205f, #70458a);
            border: 0;
            border-radius: 10px;
            box-shadow: 0 8px 18px rgba(73,32,95,.16);
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .auth-submit-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(73,32,95,.23);
        }

        .auth-submit-arrow {
            color: var(--auth-gold);
            font-size: 17px;
        }

        .auth-switch-prompt {
            margin: 0;
            color: var(--auth-muted);
            font-size: 11px;
            line-height: 1.8;
            text-align: center;
        }

        .auth-switch-prompt button {
            padding: 0;
            margin-left: 3px;
            color: var(--auth-purple);
            background: transparent;
            border: 0;
            font: inherit;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }

        .membership-message {
            margin: 0;
            overflow-wrap: anywhere;
            font-size: 11px;
            line-height: 1.7;
        }

        #membership-message[data-type="error"],
        #membership-login-message[data-type="error"] {
            color: #b42340;
        }

        #membership-message[data-type="success"],
        #membership-login-message[data-type="success"] {
            color: #237448;
        }

        #membership-status {
            width: min(100%, 650px);
            margin: 0 auto 30px;
            padding: 27px;
            color: var(--auth-ink);
            background: #fff;
            border: 1px solid #e9deef;
            border-radius: 18px;
            box-shadow: 0 18px 48px rgba(39,19,51,.08);
        }

        #membership-status h3 {
            font-family: "Playfair Display", Georgia, serif;
            font-size: 25px;
        }

        #membership-status p {
            color: var(--auth-muted);
            font-size: 13px;
            line-height: 1.8;
        }

        #membership-status button {
            width: 100%;
            min-height: 46px;
            padding: 12px;
            color: #fff;
            background: var(--auth-plum);
            border: 0;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        #member-groups-content .section-heading {
            margin: 15px auto 30px;
            text-align: center;
        }

        #member-groups-content .section-heading h2 {
            color: var(--auth-ink);
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(28px, 4vw, 39px);
        }

        #member-groups-content .membership-intro {
            color: var(--auth-muted);
            font-size: 13px;
            line-height: 1.8;
        }

        #member-groups-content .group-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        #member-groups-content .group-card {
            padding: 23px;
            background: #fff;
            border: 1px solid #eae0ef;
            border-radius: 16px;
            box-shadow: 0 10px 28px rgba(39,19,51,.045);
        }

        #member-groups-content .group-card h3 {
            color: var(--auth-plum);
            font-family: "Playfair Display", Georgia, serif;
            font-size: 19px;
        }

        #member-groups-content .group-card p {
            color: var(--auth-muted);
            font-size: 12px;
            line-height: 1.8;
        }

        #member-groups-content .group-count {
            display: inline-block;
            margin-top: 12px;
            padding: 7px 10px;
            color: var(--auth-plum);
            background: var(--auth-lilac);
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
        }

        /* ADMIN CONTENT EDITOR */
        .admin-editor-card {
            width: min(100%, 850px);
            margin: 0 auto;
            padding: clamp(20px, 4vw, 35px);
            background: #fff;
            border: 1px solid #e9deef;
            border-radius: 18px;
            box-shadow: 0 18px 48px rgba(39,19,51,.07);
        }

        .admin-editor-card h3 {
            margin: 24px 0 14px;
            color: var(--auth-plum);
            font-family: "Playfair Display", Georgia, serif;
            font-size: 22px;
        }

        .admin-editor-card h3:first-child {
            margin-top: 0;
        }

        .admin-editor-card label {
            display: block;
            margin: 15px 0 7px;
            color: #403347;
            font-size: 12px;
            font-weight: 700;
        }

        .admin-editor-card input,
        .admin-editor-card textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 12px 14px;
            color: var(--auth-ink);
            background: #fcfaff;
            border: 1px solid #e7dfea;
            border-radius: 10px;
            font-family: inherit;
            font-size: 13px;
            line-height: 1.7;
        }

        .admin-editor-card textarea {
            resize: vertical;
        }

        .admin-editor-card input:focus,
        .admin-editor-card textarea:focus {
            outline: 2px solid rgba(109,67,135,.22);
            border-color: var(--auth-purple);
        }

        #admin-save-content-btn {
            width: 100%;
            min-height: 49px;
            margin-top: 25px;
            padding: 12px 18px;
            color: #fff;
            background: linear-gradient(130deg, #49205f, #70458a);
            border: 0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        #admin-save-content-btn:disabled {
            opacity: .65;
            cursor: wait;
        }

        #admin-save-message {
            min-height: 20px;
            margin-top: 12px;
            font-size: 12px;
            line-height: 1.7;
        }

        @media (max-width: 760px) {
            #membership {
                padding: 20px 12px 45px;
            }

            .auth-showcase {
                grid-template-columns: 1fr;
                min-height: auto;
                border-radius: 20px;
            }

            .auth-brand-panel {
                min-height: auto;
                padding: 27px 25px 22px;
            }

            .auth-brand-copy {
                padding: 32px 0;
            }

            .auth-brand-copy h1 {
                font-size: clamp(35px, 10vw, 46px);
            }

            .auth-brand-description {
                margin-top: 16px;
            }

            .auth-brand-verse {
                margin-top: 20px;
            }

            .auth-brand-bottom {
                padding-top: 14px;
            }

            .auth-form-panel {
                padding: 30px 24px;
            }

            #member-groups-content .group-grid {
                grid-template-columns: 1fr;
            }

            .admin-editor-card {
                padding: 20px 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #membership *,
            #membership *::before,
            #membership *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
